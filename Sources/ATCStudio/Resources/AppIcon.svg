<svg width="1024" height="1024" viewBox="152 90 696 696" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Capsule & Frame Rich Copper-Gold Gradients -->
    <linearGradient id="capsuleGrad" x1="446" y1="250" x2="554" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2C694" />
      <stop offset="45%" stop-color="#CB8853" />
      <stop offset="100%" stop-color="#9A592D" />
    </linearGradient>

    <linearGradient id="capsuleLeftShade" x1="446" y1="250" x2="500" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B682" />
      <stop offset="50%" stop-color="#B97441" />
      <stop offset="100%" stop-color="#8B4D24" />
    </linearGradient>

    <linearGradient id="frameTopGrad" x1="415" y1="219" x2="585" y2="407" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0C38E" />
      <stop offset="50%" stop-color="#D49560" />
      <stop offset="100%" stop-color="#9B5B30" />
    </linearGradient>

    <linearGradient id="frameBottomGrad" x1="415" y1="428" x2="585" y2="658" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D99B66" />
      <stop offset="55%" stop-color="#B87343" />
      <stop offset="100%" stop-color="#935228" />
    </linearGradient>

    <linearGradient id="copperWaveLeft" x1="0" y1="340" x2="0" y2="532" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DF9F69" />
      <stop offset="50%" stop-color="#B6703E" />
      <stop offset="100%" stop-color="#884B22" />
    </linearGradient>

    <linearGradient id="copperWaveRight" x1="0" y1="340" x2="0" y2="532" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDFB" />
      <stop offset="48%" stop-color="#FFF6EA" />
      <stop offset="50%" stop-color="#DEB07C" />
      <stop offset="100%" stop-color="#A66334" />
    </linearGradient>

    <linearGradient id="studioTextGrad" x1="97" y1="12" x2="239" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#AC683A" />
      <stop offset="50%" stop-color="#C8824F" />
      <stop offset="100%" stop-color="#A25F32" />
    </linearGradient>

    <clipPath id="leftHalfClip">
      <rect x="446" y="250" width="54" height="322" />
    </clipPath>
  </defs>

  <!-- Rounded App Icon Background (Delete or hide for transparent background) -->
  <rect id="App-Icon-Background" x="220" y="158" width="560" height="560" rx="112" fill="#161E21" />

  <!-- Microphone Icon Group -->
  <g id="Microphone-Icon">
    <!-- Left Soundwave Bars -->
    <g id="Soundwaves-Left">
      <rect id="Wave-Left-1" x="390.0" y="388.0" width="14" height="96" rx="7" fill="url(#copperWaveLeft)" /> <rect id="Wave-Left-2" x="363.0" y="340.0" width="14" height="192" rx="7" fill="url(#copperWaveLeft)" /> <rect id="Wave-Left-3" x="336.0" y="367.0" width="14" height="138" rx="7" fill="url(#copperWaveLeft)" /> <rect id="Wave-Left-4" x="309.0" y="400.0" width="14" height="72" rx="7" fill="url(#copperWaveLeft)" /> <rect id="Wave-Left-5" x="282.0" y="420.0" width="14" height="32" rx="7" fill="url(#copperWaveLeft)" />
    </g>

    <!-- Right Soundwave Bars -->
    <g id="Soundwaves-Right">
      <rect id="Wave-Right-1" x="596.0" y="388.0" width="14" height="96" rx="7" fill="url(#copperWaveRight)" /> <rect id="Wave-Right-2" x="623.0" y="340.0" width="14" height="192" rx="7" fill="url(#copperWaveRight)" /> <rect id="Wave-Right-3" x="650.0" y="367.0" width="14" height="138" rx="7" fill="url(#copperWaveRight)" /> <rect id="Wave-Right-4" x="677.0" y="400.0" width="14" height="72" rx="7" fill="url(#copperWaveRight)" /> <rect id="Wave-Right-5" x="704.0" y="420.0" width="14" height="32" rx="7" fill="url(#copperWaveRight)" />
    </g>

    <!-- Outer Microphone Frame & Stand -->
    <g id="Microphone-Frame">
      <path id="Frame-Top-Arch" d="M 415 407 L 415 304 A 85 85 0 0 1 585 304 L 585 407 L 570 407 L 570 304 A 70 70 0 0 0 430 304 L 430 407 Z" fill="url(#frameTopGrad)" />
      <path id="Frame-Bottom-Stand" d="M 415 428 L 430 428 L 430 518 A 70 70 0 0 0 570 518 L 570 428 L 585 428 L 585 518 A 85 85 0 0 1 511 602.28 L 511 642 L 551 642 L 561 658 L 439 658 L 449 642 L 489 642 L 489 602.28 A 85 85 0 0 1 415 518 Z" fill="url(#frameBottomGrad)" />
      <!-- Subtle highlight cap on right cradle tip matching reference image -->
      <path id="Frame-Right-Highlight" d="M 570 428 L 585 428 L 585 442 L 570 442 Z" fill="#FFF6EA" />
    </g>

    <!-- Inner Capsule with True Negative-Space Cross Cutout -->
    <g id="Microphone-Capsule-Cutout">
      <path id="Capsule-Top-Crown" d="M 446 352 L 446 304 A 54 54 0 0 1 554 304 L 554 352 L 517 352 L 517 304 L 483 304 L 483 352 Z" fill="url(#capsuleGrad)" />
      <path id="Capsule-Bottom-Body" d="M 446 384 L 483 384 L 483 512 L 517 512 L 517 384 L 554 384 L 554 518 A 54 54 0 0 1 446 518 Z" fill="url(#capsuleGrad)" />
      <!-- Subtle split-tone shading on left half of capsule matching reference image -->
      <g clip-path="url(#leftHalfClip)" opacity="0.65">
        <path d="M 446 352 L 446 304 A 54 54 0 0 1 554 304 L 554 352 L 517 352 L 517 304 L 483 304 L 483 352 Z" fill="url(#capsuleLeftShade)" />
        <path d="M 446 384 L 483 384 L 483 512 L 517 512 L 517 384 L 554 384 L 554 518 A 54 54 0 0 1 446 518 Z" fill="url(#capsuleLeftShade)" />
      </g>
    </g>
  </g>
</svg>